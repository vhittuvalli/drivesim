<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DriveSim</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.wasm.min.mjs"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud-left">
    <div class="card speedo"><span id="speed">0</span><small>km/h</small></div>
    <div class="card" id="maneuver-card"><div id="maneuver"></div></div>
    <div class="card signal" id="signal" hidden><i></i><span id="signal-text"></span></div>
    <div class="card" id="reason" hidden></div>
    <div class="card" id="neural-panel" hidden>
      <div class="row between"><b>Neural driver</b><span id="nn-driver" class="pill"></span></div>
      <div class="small" id="nn-stats"></div>
      <div class="small mono muted" id="nn-info"></div>
      <div class="pip">
        <figure><canvas id="nn-cam" width="256" height="128"></canvas><figcaption>Camera · attention</figcaption></figure>
        <figure><canvas id="nn-seg" width="64" height="32"></canvas><figcaption>Segmentation</figcaption></figure>
      </div>
      <div class="chart-head small">
        <span>Steering</span>
        <span class="legend"><i style="background:#3987e5"></i>Network <b id="nn-steer-nn" class="mono"></b></span>
        <span class="legend"><i style="background:#d95926"></i>Expert <b id="nn-steer-ex" class="mono"></b></span>
      </div>
      <canvas id="nn-chart"></canvas>
      <div class="small muted chart-foot"><span>−12 s</span><span>shaded: safety driver · up: right</span><span>now</span></div>
    </div>
  </div>

  <div id="hud-right">
    <div class="card small mono">
      <div><span id="clock"></span> · <span id="fps"></span></div>
      <div class="muted">seed <span id="seed"></span></div>
      <div id="rec" hidden><i class="dot"></i> REC <span id="rec-count">0</span></div>
      <div id="collect-status" hidden><i class="dot"></i> <span></span></div>
    </div>
    <div class="card" id="scorecard" hidden>
      <div class="row between"><b>Benchmark</b><button id="score-close" aria-label="Close scorecard">×</button></div>
      <div class="small mono muted" id="score-progress"></div>
      <div id="score-summary" hidden></div>
      <table><thead><tr><th>Scenario</th><th>Trials</th></tr></thead><tbody id="score-scenarios"></tbody></table>
      <table><thead><tr><th>Free drive</th><th class="num">Dist</th><th class="num">Takeovers</th><th class="num">Contacts</th></tr></thead><tbody id="score-drives"></tbody></table>
      <div class="small muted">✓ passed · ✓* passed with takeovers · ✗ failed (hover for details)</div>
    </div>
    <div class="card" id="scenario-card" hidden>
      <div class="row between"><b id="sc-name"></b><span id="sc-status" class="pill"></span></div>
      <div id="sc-msg"></div>
      <div class="small mono muted"><span id="sc-time"></span> <span id="sc-closest"></span></div>
    </div>
  </div>

  <div id="toast" class="card" hidden></div>

  <button id="controls-show" class="card" title="Show settings (H)" hidden>⚙ Settings</button>
  <div id="controls" class="card">
    <button id="controls-hide" title="Hide settings (H)" aria-label="Hide settings">×</button>
    <div class="group">
      <label>Camera</label>
      <div class="seg">
        <button data-cam="chase">Chase</button>
        <button data-cam="hood">Sensor</button>
        <button data-cam="orbit">Orbit</button>
        <button data-cam="top">Top</button>
      </div>
    </div>
    <div class="group grow">
      <label>Time of day</label>
      <input type="range" id="hour" min="4" max="22" step="0.05" value="14.5">
    </div>
    <div class="group">
      <label>Road</label>
      <select id="road" title="City streets or the highway loop around the city (G)">
        <option value="city">City</option>
        <option value="highway">Highway</option>
      </select>
    </div>
    <div class="group">
      <label>Traffic · <span id="traffic-count">0</span> cars</label>
      <input type="range" id="cars" min="0" max="120" step="1" value="40">
    </div>
    <div class="group">
      <label>Highway · <span id="hw-count">0</span> cars</label>
      <input type="range" id="hwcars" min="0" max="160" step="1" value="60">
    </div>
    <div class="group">
      <label>Pedestrians · <span id="ped-count">0</span></label>
      <input type="range" id="peds" min="0" max="200" step="1" value="70">
    </div>
    <div class="group">
      <label>Scenario</label>
      <div class="row">
        <select id="scenario"><option value="">Free drive</option></select>
        <button id="btn-restart" title="Restart scenario">↻</button>
      </div>
    </div>
    <div class="group">
      <label>Weather</label>
      <select id="weather"></select>
    </div>
    <div class="group">
      <label>Tools</label>
      <div class="row">
        <button id="btn-drive" title="Take the wheel (M)">Drive</button>
        <button id="btn-debug" title="Planner overlay (O)">Debug</button>
        <button id="btn-rec" title="Record the roof camera as a dataset (R)">Record</button>
        <button id="btn-link" title="Copy a link to this setup">Link</button>
      </div>
    </div>
    <div class="group">
      <label>Learning</label>
      <div class="row">
        <button id="btn-collect" title="Drive automatically in varied conditions and stream training data to data/ (C)">Collect</button>
        <button id="btn-neural" title="Let the trained network drive, with the expert as safety driver (N)">Neural</button>
        <button id="btn-bench" title="Score the network on every scenario and in free driving (B)">Benchmark</button>
      </div>
    </div>
    <div class="group">
      <label>Sim</label>
      <div class="row">
        <select id="sim-speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select>
        <button id="btn-pause">Pause</button>
        <button id="btn-city">New city</button>
      </div>
    </div>
    <div class="group">
      <label>Quality</label>
      <div class="row">
        <label class="check"><input type="checkbox" id="chk-shadows" checked> Shadows</label>
        <label class="check"><input type="checkbox" id="chk-bloom" checked> Post FX</label>
      </div>
    </div>
  </div>

  <div id="loading"><div class="spinner"></div><div id="loading-text">Loading…</div></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
